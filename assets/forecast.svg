<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-label="Cash runway forecast: a projected balance curve drawing across 30, 60 and 90 days">
  <defs>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A78BFA" stop-opacity=".35"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></linearGradient>
    <clipPath id="reveal"><rect x="40" y="60" width="0" height="250"><animate attributeName="width" values="0;520;520" keyTimes="0;.55;1" dur="5s" repeatCount="indefinite"/></rect></clipPath>
  </defs>
  <style>
    .mono{font-family:'JetBrains Mono',SFMono-Regular,Consolas,Menlo,monospace}
    .tab{opacity:0;animation:t 15s infinite}
    .t2{animation-delay:5s}.t3{animation-delay:10s}
    @keyframes t{0%{opacity:0}2%,32%{opacity:1}34%,100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.t1{opacity:1}}
  </style>
  <rect width="600" height="340" rx="22" fill="#090B10"/>
  <text x="30" y="44" class="mono" font-size="11" letter-spacing="3" fill="#A78BFA">[ CASH RUNWAY FORECAST ]</text>

  <g class="mono" font-size="11" font-weight="700">
    <rect x="404" y="24" width="168" height="30" rx="10" fill="#101722" stroke="#C9D0DA" stroke-opacity=".18"/>
    <text x="426" y="44" fill="#929BA8">30D</text><text x="476" y="44" fill="#929BA8">60D</text><text x="526" y="44" fill="#929BA8">90D</text>
    <g class="tab t1"><rect x="410" y="28" width="46" height="22" rx="7" fill="#A78BFA"/><text x="426" y="44" fill="#090B10">30D</text></g>
    <g class="tab t2"><rect x="460" y="28" width="46" height="22" rx="7" fill="#A78BFA"/><text x="476" y="44" fill="#090B10">60D</text></g>
    <g class="tab t3"><rect x="510" y="28" width="46" height="22" rx="7" fill="#A78BFA"/><text x="526" y="44" fill="#090B10">90D</text></g>
  </g>

  <g stroke="#C9D0DA" stroke-opacity=".08">
    <line x1="40" y1="110" x2="560" y2="110"/><line x1="40" y1="170" x2="560" y2="170"/><line x1="40" y1="230" x2="560" y2="230"/><line x1="40" y1="290" x2="560" y2="290"/>
  </g>
  <g clip-path="url(#reveal)">
    <path d="M40 200 L90 200 L100 236 L180 236 L190 120 L270 122 L280 160 L360 160 L370 196 L450 198 L460 90 L560 92 L560 300 L40 300 Z" fill="url(#area)"/>
    <path d="M40 200 L90 200 L100 236 L180 236 L190 120 L270 122 L280 160 L360 160 L370 196 L450 198 L460 90 L560 92" fill="none" stroke="#A78BFA" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <g class="mono" font-size="10">
    <text x="104" y="256" fill="#D9A46C">rent −₹22,000</text>
    <text x="194" y="110" fill="#83B8FF">salary +₹95,000</text>
    <text x="40" y="322" fill="#929BA8">today</text><text x="520" y="322" fill="#929BA8">+90 days</text>
  </g>
</svg>
