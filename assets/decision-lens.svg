<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-label="Decision Lens: a purchase amount compared across Buy Now, Save 30 Days and Direct to Vault scenarios">
  <style>
    .mono{font-family:'JetBrains Mono',SFMono-Regular,Consolas,Menlo,monospace}
    .card{animation:float 6s ease-in-out infinite}
    .k2{animation-delay:-2s}.k3{animation-delay:-4s}
    @keyframes float{0%,100%{transform:translateY(-4px)}50%{transform:translateY(4px)}}
    .hl{opacity:0;animation:pick 9s infinite}
    .h2{animation-delay:3s}.h3{animation-delay:6s}
    @keyframes pick{0%{opacity:0}4%,30%{opacity:1}34%,100%{opacity:0}}
    .lens{animation:spin 8s linear infinite;transform-box:fill-box;transform-origin:center}
    @keyframes spin{to{transform:rotate(360deg)}}
    .caret{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.h1{opacity:1}}
  </style>
  <rect width="600" height="340" rx="22" fill="#090B10"/>
  <text x="30" y="44" class="mono" font-size="11" letter-spacing="3" fill="#D9A46C">[ DECISION LENS // SIMULATOR ]</text>
  <g transform="translate(540 36)"><circle class="lens" r="16" fill="none" stroke="#D9A46C" stroke-dasharray="6 4"/><path d="M -4 -8 L 4 0 L -4 8" fill="none" stroke="#D9A46C" stroke-width="2"/></g>

  <text x="30" y="92" class="mono" font-size="11" fill="#929BA8">SIMULATE PURCHASE COMMITMENT</text>
  <text x="30" y="132" class="mono" font-size="34" font-weight="800" fill="#F5F7F3">₹35,000</text>
  <rect class="caret" x="200" y="104" width="3" height="32" fill="#83B8FF"/>
  <line x1="30" y1="144" x2="210" y2="144" stroke="#83B8FF" stroke-opacity=".5" stroke-width="2"/>

  <g class="mono">
    <g class="card">
      <rect x="30" y="170" width="170" height="130" rx="16" fill="#0C1118" stroke="#C9D0DA" stroke-opacity=".15"/>
      <rect class="hl h1" x="30" y="170" width="170" height="130" rx="16" fill="#1E1916" stroke="#D9A46C" stroke-width="1.5"/>
      <text x="46" y="198" font-size="11" font-weight="700" fill="#D9A46C">✓ BUY NOW</text>
      <text x="46" y="236" font-size="18" font-weight="800" fill="#F5F7F3">₹33,885</text>
      <text x="46" y="262" font-size="10" fill="#929BA8">margin left</text>
      <text x="46" y="282" font-size="10" fill="#929BA8">−51% this month</text>
    </g>
    <g class="card k2">
      <rect x="215" y="170" width="170" height="130" rx="16" fill="#0C1118" stroke="#C9D0DA" stroke-opacity=".15"/>
      <rect class="hl h2" x="215" y="170" width="170" height="130" rx="16" fill="#121B2A" stroke="#83B8FF" stroke-width="1.5"/>
      <text x="231" y="198" font-size="11" font-weight="700" fill="#83B8FF">◷ SAVE 30 DAYS</text>
      <text x="231" y="236" font-size="18" font-weight="800" fill="#F5F7F3">₹68,885</text>
      <text x="231" y="262" font-size="10" fill="#929BA8">margin kept</text>
      <text x="231" y="282" font-size="10" fill="#929BA8">no budget penalty</text>
    </g>
    <g class="card k3">
      <rect x="400" y="170" width="170" height="130" rx="16" fill="#0C1118" stroke="#C9D0DA" stroke-opacity=".15"/>
      <rect class="hl h3" x="400" y="170" width="170" height="130" rx="16" fill="#141F16" stroke="#B9F36A" stroke-width="1.5"/>
      <text x="416" y="198" font-size="11" font-weight="700" fill="#B9F36A">» TO VAULT</text>
      <text x="416" y="236" font-size="18" font-weight="800" fill="#B9F36A">+₹35,000</text>
      <text x="416" y="262" font-size="10" fill="#929BA8">into your goal</text>
      <text x="416" y="282" font-size="10" fill="#929BA8">reach it sooner</text>
    </g>
  </g>
</svg>
