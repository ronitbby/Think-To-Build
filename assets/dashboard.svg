<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-label="Financial Command Center: an orbit gauge of available margin beside inflow, outflow and retention cards">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101722"/><stop offset="1" stop-color="#090B10"/></linearGradient>
  </defs>
  <style>
    .mono{font-family:'JetBrains Mono',SFMono-Regular,Consolas,Menlo,monospace}
    .tilt{animation:tilt 9s ease-in-out infinite;transform-origin:300px 170px}
    @keyframes tilt{0%,100%{transform:perspective(900px) rotateY(-7deg)}50%{transform:perspective(900px) rotateY(7deg)}}
    .ring{stroke-dasharray:440;animation:fill 4s cubic-bezier(.16,1,.3,1) infinite}
    @keyframes fill{0%{stroke-dashoffset:440}60%,100%{stroke-dashoffset:180}}
    .spin{animation:spin 18s linear infinite;transform-box:fill-box;transform-origin:center}
    @keyframes spin{to{transform:rotate(360deg)}}
    .bar{animation:grow 4s cubic-bezier(.16,1,.3,1) infinite;transform-box:fill-box;transform-origin:left}
    @keyframes grow{0%{transform:scaleX(0)}50%,100%{transform:scaleX(1)}}
    .c2{animation-delay:.2s}.c3{animation-delay:.4s}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect width="600" height="340" rx="22" fill="#090B10"/>
  <g class="tilt">
    <rect x="30" y="26" width="540" height="288" rx="20" fill="url(#bg)" stroke="#C9D0DA" stroke-opacity=".18"/>
    <text x="54" y="56" class="mono" font-size="11" letter-spacing="3" fill="#83B8FF">[ FINANCIAL COMMAND // OVERVIEW ]</text>

    <circle class="spin" cx="160" cy="180" r="98" fill="none" stroke="#C9D0DA" stroke-opacity=".2" stroke-dasharray="3 7"/>
    <circle cx="160" cy="180" r="70" fill="none" stroke="#B9F36A" stroke-opacity=".12" stroke-width="10"/>
    <circle class="ring" cx="160" cy="180" r="70" fill="none" stroke="#B9F36A" stroke-width="10" stroke-linecap="round" transform="rotate(-90 160 180)"/>
    <text x="160" y="168" text-anchor="middle" class="mono" font-size="9" letter-spacing="2" fill="#929BA8">AVAILABLE MARGIN</text>
    <text x="160" y="192" text-anchor="middle" class="mono" font-size="20" font-weight="800" fill="#F5F7F3">₹68,885</text>
    <text x="160" y="210" text-anchor="middle" class="mono" font-size="10" fill="#B9F36A">59% retained</text>

    <g class="mono">
      <rect x="290" y="76" width="250" height="62" rx="12" fill="#101722" stroke="#83B8FF" stroke-opacity=".35"/>
      <text x="306" y="98" font-size="10" letter-spacing="2" fill="#929BA8">GROSS INFLOW</text>
      <text x="306" y="124" font-size="18" font-weight="800" fill="#83B8FF">₹1,16,700</text>
      <rect class="bar" x="420" y="116" width="104" height="6" rx="3" fill="#83B8FF"/>

      <rect x="290" y="148" width="250" height="62" rx="12" fill="#101722" stroke="#D9A46C" stroke-opacity=".35"/>
      <text x="306" y="170" font-size="10" letter-spacing="2" fill="#929BA8">GROSS OUTFLOW</text>
      <text x="306" y="196" font-size="18" font-weight="800" fill="#D9A46C">₹47,815</text>
      <rect class="bar c2" x="420" y="188" width="44" height="6" rx="3" fill="#D9A46C"/>

      <rect x="290" y="220" width="250" height="62" rx="12" fill="#101722" stroke="#B9F36A" stroke-opacity=".35"/>
      <text x="306" y="242" font-size="10" letter-spacing="2" fill="#929BA8">RETENTION RATE</text>
      <text x="306" y="268" font-size="18" font-weight="800" fill="#B9F36A">59%</text>
      <rect class="bar c3" x="420" y="260" width="62" height="6" rx="3" fill="#B9F36A"/>
    </g>
  </g>
</svg>
