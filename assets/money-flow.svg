<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Money flow: income splits into tracked outflow, savings vaults and the margin you keep">
  <defs>
    <path id="a" d="M 230 150 C 420 150 420 70 600 70"/>
    <path id="b" d="M 230 150 C 420 150 420 230 600 230"/>
    <path id="c" d="M 230 150 L 600 150"/>
    <path id="d" d="M 760 150 L 960 150"/>
  </defs>
  <style>
    .mono{font-family:'JetBrains Mono',SFMono-Regular,Consolas,Menlo,monospace}
    .flow{stroke-dasharray:5 9;animation:dash 1s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-28}}
    .box{animation:float 5s ease-in-out infinite}
    .b2{animation-delay:-1.6s}.b3{animation-delay:-3.2s}
    @keyframes float{0%,100%{transform:translateY(-3px)}50%{transform:translateY(3px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect width="1200" height="300" rx="22" fill="#090B10"/>
  <rect x=".5" y=".5" width="1199" height="299" rx="22" fill="none" stroke="#C9D0DA" stroke-opacity=".12"/>

  <path class="flow" d="M 230 150 C 420 150 420 70 600 70" fill="none" stroke="#D9A46C" stroke-width="2"/>
  <path class="flow" d="M 230 150 C 420 150 420 230 600 230" fill="none" stroke="#A78BFA" stroke-width="2"/>
  <path class="flow" d="M 230 150 L 600 150" fill="none" stroke="#83B8FF" stroke-width="2"/>
  <path class="flow" d="M 760 150 L 960 150" fill="none" stroke="#B9F36A" stroke-width="2.5"/>

  <g fill="#83B8FF"><circle r="5"><animateMotion dur="2s" repeatCount="indefinite"><mpath href="#c"/></animateMotion></circle></g>
  <g fill="#D9A46C"><circle r="5"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#a"/></animateMotion></circle></g>
  <g fill="#A78BFA"><circle r="5"><animateMotion dur="2.8s" repeatCount="indefinite"><mpath href="#b"/></animateMotion></circle></g>
  <g fill="#B9F36A"><circle r="6"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#d"/></animateMotion></circle></g>

  <g class="mono">
    <g class="box"><rect x="50" y="110" width="180" height="80" rx="16" fill="#101722" stroke="#83B8FF" stroke-opacity=".5"/>
      <text x="70" y="140" font-size="10" letter-spacing="2" fill="#83B8FF">INCOME</text><text x="70" y="168" font-size="18" font-weight="800" fill="#F5F7F3">Salary &amp; more</text></g>
    <g class="box b2"><rect x="600" y="40" width="160" height="60" rx="14" fill="#101722" stroke="#D9A46C" stroke-opacity=".5"/>
      <text x="618" y="66" font-size="10" letter-spacing="2" fill="#D9A46C">OUTFLOW</text><text x="618" y="86" font-size="12" fill="#E2E5EA">fenced by budgets</text></g>
    <g class="box b3"><rect x="600" y="120" width="160" height="60" rx="14" fill="#101722" stroke="#83B8FF" stroke-opacity=".5"/>
      <text x="618" y="146" font-size="10" letter-spacing="2" fill="#83B8FF">MARGIN</text><text x="618" y="166" font-size="12" fill="#E2E5EA">what you keep</text></g>
    <g class="box"><rect x="600" y="200" width="160" height="60" rx="14" fill="#101722" stroke="#A78BFA" stroke-opacity=".5"/>
      <text x="618" y="226" font-size="10" letter-spacing="2" fill="#A78BFA">VAULTS</text><text x="618" y="246" font-size="12" fill="#E2E5EA">savings goals</text></g>
    <g class="box b2"><rect x="960" y="100" width="200" height="100" rx="18" fill="#141F16" stroke="#B9F36A" stroke-opacity=".7"/>
      <text x="982" y="132" font-size="10" letter-spacing="2" fill="#B9F36A">90-DAY RUNWAY</text>
      <text x="982" y="166" font-size="24" font-weight="800" fill="#B9F36A">₹2.4L</text>
      <text x="982" y="186" font-size="11" fill="#E2E5EA">projected safe</text></g>
  </g>
</svg>
